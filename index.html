=Math.sin(d1/2)**2+Math.cos(a1*3.14/180)*Math.cos(a2*3.14/180)*Math.sin(d2/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}function c(){const av=document.getElementById('a').value;const bv=document.getElementById('b').value;if(!av||!bv){alert('Select both');return;}const A=av.split(',');const B=bv.split(',');AN=A[2];BN=B[2];D=h(parseFloat(A[0]),parseFloat(A[1]),parseFloat(B[0]),parseFloat(B[1]))*1.3;F=Math.round((50+D*12)/10)*10*parseInt(document.getElementById('p').value);document.getElementById('i').innerHTML=AN+' to '+BN+'<br><b>'+D.toFixed(1)+' km = R'+F+'</b>';document.getElementById('am').innerText=F;document.getElementById('pay').style.display='block';}function w(){if(!F){alert('Calc first');return;}const m='Hi Izandla! '+AN+' to '+BN+' '+D.toFixed(1)+'km R'+F;window.open('https://wa.me/27700000000?text='+encodeURIComponent(m));}function k(){const e=prompt('Email:');if(!e)return;PaystackPop.setup({key:'pk_test_xxxxx',email:e,amount:F*100,currency:'ZAR',ref:''+Date.now(),callback:function(r){alert('Paid '+r.reference);w();}}).openIframe();}</script></body></html>
